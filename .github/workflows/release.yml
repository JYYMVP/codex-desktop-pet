name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix
        required: true
        default: 0.10.3
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version and signing policy
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid SemVer: $version" }
          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          if ("${{ github.ref_type }}" -eq "tag" -and
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            throw "Tagged releases require WINDOWS_SIGNING_CERTIFICATE_BASE64."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Decode signing certificate
        if: env.SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          "SIGNING_CERTIFICATE_PATH=$path" | Out-File $env:GITHUB_ENV -Append

      - name: Build, sign, and package
        shell: pwsh
        run: |
          $parameters = @{
            Version = $env:RELEASE_VERSION
            OutputDirectory = "${{ github.workspace }}\artifacts\release"
          }
          if ($env:SIGNING_CERTIFICATE_PATH) {
            $parameters.CertificatePath = $env:SIGNING_CERTIFICATE_PATH
            $parameters.CertificatePassword = $env:SIGNING_CERTIFICATE_PASSWORD
          }
          .\scripts\build-release.ps1 @parameters

      - name: Verify installer signature for tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $paths = @(
            ".\artifacts\release\publish-win-x64\CodexDesktopPet.exe",
            ".\artifacts\release\CodexDesktopPet-Setup-x64.exe"
          )
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne "Valid") {
              throw "$path signature is $($signature.Status)."
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: CodexDesktopPet-${{ env.RELEASE_VERSION }}-windows
          path: |
            artifacts/release/CodexDesktopPet-win-x64.zip
            artifacts/release/CodexDesktopPet-win-x64.zip.sha256
            artifacts/release/CodexDesktopPet-Setup-x64.exe
            artifacts/release/CodexDesktopPet-Setup-x64.exe.sha256

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            .\artifacts\release\CodexDesktopPet-win-x64.zip `
            .\artifacts\release\CodexDesktopPet-win-x64.zip.sha256 `
            .\artifacts\release\CodexDesktopPet-Setup-x64.exe `
            .\artifacts\release\CodexDesktopPet-Setup-x64.exe.sha256 `
            --verify-tag --generate-notes --title "Codex Desktop Pet $env:RELEASE_VERSION"
